<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1019"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<title>Dota Coach</title><style>:root{--bg:#0e1019;--card:#171a28;--line:#262a3d;--tx:#eceef7;--mu:#8b91ab;--gold:#f2b134;--g:#3ddc97;--r:#ff5d6c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 "Segoe UI",system-ui,sans-serif;display:flex;height:100vh}
::-webkit-scrollbar{width:10px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px}
.tabs{display:flex;flex-direction:column;gap:6px;padding:14px 10px;width:92px;background:var(--card);border-right:1px solid var(--line)}
.tabs button{background:none;border:0;color:var(--mu);padding:12px 4px;border-radius:12px;font:600 12px inherit;display:grid;justify-items:center;gap:4px;cursor:pointer;transition:.15s}
.tabs button:hover{background:var(--line);color:var(--tx)}.tabs button.on{color:var(--gold);background:rgba(242,177,52,.12)}
main{flex:1;overflow:auto;padding:20px;max-width:780px;margin:0 auto;width:100%}h1{margin:0 0 12px;font-size:24px}h2{font-size:16px;margin:20px 0 8px}small,.mu{color:var(--mu);display:block;font-size:13px}
.ic{vertical-align:middle}.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:14px;padding:10px;margin-bottom:8px;font:inherit;cursor:pointer;transition:.15s}
.row:hover{border-color:var(--gold);transform:translateY(-1px)}.row img{border-radius:6px;flex:none}.grow{flex:1;min-width:0}.wr{font-weight:700;font-size:17px}
.g{color:var(--g)}.r{color:var(--r)}.bar{display:block;height:6px;background:var(--line);border-radius:9px;margin-top:5px;overflow:hidden}.bar u{display:block;height:100%;background:var(--gold);border-radius:9px;transition:width .4s}.bar u.g{background:var(--g)}.bar u.r{background:var(--r)}
.chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:10px}.chip,.btn{border:1px solid var(--line);background:var(--card);color:var(--tx);padding:9px 14px;border-radius:99px;font:600 14px inherit;cursor:pointer;display:inline-flex;gap:6px;align-items:center;transition:.15s;white-space:nowrap}
.chip:hover{border-color:var(--gold)}.chip.on,.btn.pri{background:var(--gold);color:#1a1300;border-color:var(--gold)}.btn:active,.chip:active{transform:scale(.97)}
body.busy .btn,body.busy .row{opacity:.6;pointer-events:none}
input,select{width:100%;background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:12px;font:inherit;margin-bottom:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}.card.warn{border-color:var(--gold)}
.tag{display:inline-flex;align-items:center;gap:8px;margin:3px 6px 3px 0;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:4px 10px 4px 4px}.tag img{border-radius:5px}
.t{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:6px;padding:7px 0;border-top:1px solid var(--line);font-size:14px}.t:first-child{border:0;color:var(--mu)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:16px}#modal.show{display:flex}
#modal>div{background:var(--bg);border:1px solid var(--line);border-radius:18px;width:100%;max-width:560px;max-height:88vh;overflow:auto;padding:18px;animation:pop .2s}
#toasts{position:fixed;right:16px;top:16px;display:grid;gap:8px;z-index:9;width:min(340px,calc(100vw - 32px))}
.toast{display:flex;gap:10px;background:var(--card);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:12px;padding:12px;animation:in .25s}.toast.alert{border-left-color:var(--r)}.toast.check{border-left-color:var(--g)}.toast b{display:block}
.x{background:none;border:0;color:var(--mu);cursor:pointer;margin-left:auto}.x:hover{color:var(--tx)}
@keyframes in{from{opacity:0;transform:translateX(20px)}}@keyframes pop{from{opacity:0;transform:scale(.96)}}
@media(max-width:640px){body{flex-direction:column-reverse}.tabs{flex-direction:row;width:100%;border:0;border-top:1px solid var(--line)}.tabs button{flex:1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

body{height:100vh;height:100dvh}main{padding-bottom:24px}
.tabs{padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
#toasts{top:calc(12px + env(safe-area-inset-top,0px))}
@media(max-width:640px){main{padding:16px 14px}.tabs button{padding:8px 2px}h1{font-size:21px}.t{font-size:13px}}
</style></head>
<body><nav class="tabs" id="tabs"></nav><main id="view"></main><div id="toasts"></div><div id="modal"></div>
<script>const ICONS = {
  meta: '<path d="M12 3c1 4 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-4-1-6 1-9z"/>',
  heroes: '<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/>',
  profile: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  settings: '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>',
  x: '<path d="M6 6l12 12M18 6L6 18"/>',
  check: '<path d="M5 12l5 5 9-10"/>',
  alert: '<path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17v.5"/>',
  bell: '<path d="M6 17v-6a6 6 0 0 1 12 0v6l2 2H4z"/><path d="M10 21h4"/>',
  refresh: '<path d="M20 11a8 8 0 1 0-2 6"/><path d="M20 4v7h-7"/>',
  logout: '<path d="M10 4H5v16h5M15 8l4 4-4 4M19 12H9"/>',
  search: '<circle cx="11" cy="11" r="6"/><path d="M16 16l5 5"/>'
};
</script><script>const DEF={steamId:'',bracket:'all',osNotify:false,tab:'meta'};
window.api={
  get:async()=>{try{return{...DEF,...JSON.parse(localStorage.getItem('dc')||'{}')}}catch{return{...DEF}}},
  set:async p=>{const s={...await window.api.get(),...p};try{localStorage.setItem('dc',JSON.stringify(s))}catch{}return s},
  notify:async()=>{},
  api:async p=>{for(let i=0;i<3;i++){const c=new AbortController(),t=setTimeout(()=>c.abort(),10000);
    try{const r=await fetch('https://api.opendota.com/api'+p,{signal:c.signal});if(!r.ok)throw new Error('HTTP '+r.status);return{ok:true,data:await r.json()}}
    catch(e){if(i==2)return{ok:false,error:e.name=='AbortError'?'Сервер не ответил за 10 секунд.':'Нет связи с OpenDota. Проверьте интернет и попробуйте снова.'}}
    finally{clearTimeout(t)}
    await new Promise(r=>setTimeout(r,800*(i+1)))}}
};
const A = window.api, $ = s => document.querySelector(s);
const CDN = 'https://cdn.cloudflare.steamstatic.com';
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ic = (n, s = 22) => `<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[n]}</svg>`;
const RF = { 'Все': null, 'Керри': 'Carry', 'Поддержка': 'Support', 'Инициатор': 'Initiator', 'Танк': 'Durable', 'Контроль': 'Disabler' };
const RU = { Carry: 'Керри', Support: 'Поддержка', Nuker: 'Урон', Disabler: 'Контроль', Jungler: 'Лесник', Durable: 'Танк', Escape: 'Побег', Pusher: 'Пуш', Initiator: 'Инициатор' };
const BR = ['Все ранги', 'Herald', 'Guardian', 'Crusader', 'Archon', 'Legend', 'Ancient', 'Divine', 'Immortal'];
const TABS = [['meta', 'Мета'], ['heroes', 'Герои'], ['profile', 'Разбор'], ['settings', 'Настройки']];
let S = {}, heroes = [], byId = {}, items = null, role = 'Все', tab = 'meta', q = '', busy = false, P = null, PE = '', loadFail = '';

function toast(title, text, type = 'bell') {
  const t = document.createElement('div'); t.className = 'toast ' + type;
  t.innerHTML = `${ic(type)}<div><b>${esc(title)}</b>${esc(text)}<small>${new Date().toLocaleTimeString('ru-RU')}</small></div><button class="x" data-act="toastx" aria-label="Закрыть">${ic('x', 18)}</button>`;
  $('#toasts').append(t); setTimeout(() => t.remove(), 6000);
  if (S.osNotify && type === 'alert') A.notify(title, text);
}
async function call(p) { const r = await A.api(p); if (!r.ok) { toast('Ошибка', r.error, 'alert'); throw new Error(r.error); } return r.data; }
async function run(fn) { if (busy) return; busy = true; document.body.classList.add('busy'); try { await fn(); } catch (e) { console.error(e); } finally { busy = false; document.body.classList.remove('busy'); } }
const wr = h => { let p = 0, w = 0; (S.bracket === 'all' ? [1, 2, 3, 4, 5, 6, 7, 8] : [+S.bracket]).forEach(i => { p += h[i + '_pick'] || 0; w += h[i + '_win'] || 0; }); return p ? w / p * 100 : 0; };
const cls = w => w >= 52 ? 'g' : w < 48 ? 'r' : '';
const hrow = h => { const w = wr(h); return `<button class="row" data-act="hero" data-id="${h.id}"><img src="${CDN + h.img}" alt="" width="64" height="36"><span class="grow"><b>${esc(h.localized_name)}</b><small>${h.roles.slice(0, 3).map(r => RU[r] || r).join(' · ')}</small><i class="bar"><u class="${cls(w)}" style="width:${Math.min(100, Math.max(0, (w - 40) * 5))}%"></u></i></span><span class="wr ${cls(w)}">${w.toFixed(1)}%</span></button>`; };
const chips = () => `<div class="chips">${Object.keys(RF).map(r => `<button class="chip ${r === role ? 'on' : ''}" data-act="role" data-r="${r}">${r}</button>`).join('')}</div>`;
const filt = () => heroes.filter(h => (!RF[role] || h.roles.includes(RF[role])) && (!q || h.localized_name.toLowerCase().includes(q.toLowerCase())));

function vMeta() {
  if (!heroes.length) return `<h1>Мета</h1><div class="card">${esc(loadFail || 'Загрузка…')}</div><button class="btn pri" data-act="reload">${ic('refresh', 18)}Повторить</button>`;
  return `<h1>Лучшие герои патча</h1><small>${S.bracket === 'all' ? 'Все ранги' : BR[S.bracket]}. Нажмите на героя: контрпики и предметы.</small><br>${chips()}${filt().sort((a, b) => wr(b) - wr(a)).slice(0, 30).map(hrow).join('') || '<p class="mu">Никого не нашли.</p>'}`;
}
function vHeroes() { return `<h1>Все герои (${heroes.length})</h1><input id="q" placeholder="Найти героя" value="${esc(q)}">${chips()}<div id="hl">${filt().sort((a, b) => a.localized_name.localeCompare(b.localized_name)).map(hrow).join('') || '<p class="mu">Никого не нашли.</p>'}</div>`; }

const acc = t => { const m = String(t).match(/7656\d{13}/); if (m) return String(BigInt(m[0]) - 76561197960265728n); const n = String(t).trim(); return /^\d{5,10}$/.test(n) ? n : null; };
const won = m => (m.player_slot < 128) === m.radiant_win;
const avg = (a, k) => a.length ? a.reduce((s, m) => s + (m[k] || 0), 0) / a.length : 0;
function vProfile() {
  if (!S.steamId) return `<h1>Разбор профиля</h1><p class="mu">Вставьте Steam ID или ссылку на профиль (steamcommunity.com/profiles/7656…). Профиль Dota должен быть открытым.</p><input id="sid" placeholder="Steam ID или ссылка"><button class="btn pri" data-act="login">${ic('check', 18)}Разобрать мои игры</button>`;
  if (PE) return `<h1>Разбор профиля</h1><div class="card">${esc(PE)}</div><button class="btn pri" data-act="reload">${ic('refresh', 18)}Повторить</button>`;
  if (!P) { setTimeout(() => { if (!P && !PE) loadProfile(); }, 0); return '<h1>Разбор профиля</h1><p class="mu">Загружаем матчи…</p>'; }
  const m = P.rm; if (!m.length) return `<h1>Разбор профиля</h1><div class="card warn">Матчей не видно. В настройках Dota 2 включите «Показывать данные матчей публично» и повторите.</div><button class="btn" data-act="reload">${ic('refresh', 18)}Обновить</button>`;
  const W = m.filter(won), L = m.filter(x => !won(x)), tot = P.wl.win + P.wl.lose;
  const rows = [['Золото/мин', 'gold_per_min'], ['Опыт/мин', 'xp_per_min'], ['Смерти', 'deaths'], ['Убийства', 'kills']].map(([n, k]) => { const a = avg(W, k), b = avg(L, k); return `<div class="t"><span>${n}</span><span>${a.toFixed(1)}</span><span>${b.toFixed(1)}</span><span class="${(k === 'deaths' ? a < b : a > b) ? 'g' : 'r'}">${(a - b > 0 ? '+' : '') + (a - b).toFixed(1)}</span></div>`; }).join('');
  const dd = avg(L, 'deaths') - avg(W, 'deaths');
  const tip = !L.length ? 'В последних матчах поражений нет. Так держать.' : dd > 2 ? `Главное: в проигрышах вы умираете чаще на ${dd.toFixed(1)}. Играйте осторожнее после середины игры.` : 'Смертей поровну в победах и поражениях. Смотрите на фарм и опыт: там основная разница.';
  return `<h1>Мой разбор</h1><div class="card warn"><b>${esc(tip)}</b></div><div class="card">Побед: <b class="g">${P.wl.win}</b> · Поражений: <b class="r">${P.wl.lose}</b> · ${tot ? (P.wl.win / tot * 100).toFixed(1) : 0}%</div>
  <h2>Победы и поражения (последние ${m.length})</h2><div class="card"><div class="t"><span></span><span>Победа</span><span>Поражение</span><span>Разница</span></div>${rows}</div>
  <h2>Последние матчи</h2>${m.slice(0, 10).map(x => { const h = byId[x.hero_id]; return `<div class="row">${h ? `<img src="${CDN + h.img}" alt="" width="64" height="36">` : ''}<span class="grow"><b>${h ? esc(h.localized_name) : 'Герой'}</b><small>${x.kills}/${x.deaths}/${x.assists} · ${Math.round(x.duration / 60)} мин</small></span><b class="${won(x) ? 'g' : 'r'}">${won(x) ? 'Победа' : 'Поражение'}</b></div>`; }).join('')}
  <button class="btn" data-act="reload">${ic('refresh', 18)}Обновить</button>`;
}
function loadProfile() { P = null; PE = ''; return run(async () => { try { const [wl, rm] = await Promise.all([call(`/players/${S.steamId}/wl`), call(`/players/${S.steamId}/recentMatches`)]); P = { wl, rm }; } catch (e) { PE = e.message; } render(); }); }
function vSettings() {
  return `<h1>Настройки</h1><h2>Ранг для статистики</h2><select id="bracket">${BR.map((b, i) => `<option value="${i ? i : 'all'}" ${String(S.bracket) === String(i ? i : 'all') ? 'selected' : ''}>${b}</option>`).join('')}</select>
  <h2>Стартовая вкладка</h2><select id="tabset">${TABS.map(([k, n]) => `<option value="${k}" ${S.tab === k ? 'selected' : ''}>${n}</option>`).join('')}</select>
  
  <h2>Профиль Steam</h2><div class="card">${S.steamId ? 'ID ' + esc(S.steamId) : 'Не выбран'}</div>${S.steamId ? `<button class="btn" data-act="logout">${ic('logout', 18)}Выйти</button>` : ''}`;
}
function render() { $('#tabs').innerHTML = TABS.map(([k, n]) => `<button data-act="tab" data-tab="${k}" class="${k === tab ? 'on' : ''}">${ic(k)}${n}</button>`).join(''); $('#view').innerHTML = { meta: vMeta, heroes: vHeroes, profile: vProfile, settings: vSettings }[tab](); }

async function loadHeroes() { return run(async () => { try { loadFail = ''; heroes = await call('/heroStats'); heroes.forEach(h => byId[h.id] = h); } catch (e) { loadFail = e.message; } render(); }); }
const set = async p => { S = await A.set(p); };
function openHero(id) {
  run(async () => {
    const [pop, mu] = await Promise.all([call(`/heroes/${id}/itemPopularity`), call(`/heroes/${id}/matchups`)]);
    if (!items) { const c = await call('/constants/items'); items = {}; Object.values(c).forEach(i => { if (i.id) items[i.id] = i; }); }
    const cnt = {}; ['mid_game_items', 'late_game_items'].forEach(k => Object.entries(pop[k] || {}).forEach(([i, n]) => cnt[i] = (cnt[i] || 0) + n));
    const top = Object.entries(cnt).sort((a, b) => b[1] - a[1]).slice(0, 8).map(([i]) => items[i]).filter(Boolean);
    const m = mu.filter(x => x.games_played >= 150 && byId[x.hero_id]).map(x => ({ h: byId[x.hero_id], w: x.wins / x.games_played * 100 })).sort((a, b) => a.w - b.w);
    const tg = (h, t) => `<span class="tag"><img src="${CDN + h}" alt="" width="${t ? 48 : 56}" height="${t ? 36 : 32}">`;
    const hero = byId[id], hw = wr(hero);
    $('#modal').innerHTML = `<div><button class="x" data-act="close" aria-label="Закрыть">${ic('x')}</button><div class="row" style="border:0;padding:0;background:none"><img src="${CDN + hero.img}" alt="" width="96" height="54"><span><h1 style="margin:0">${esc(hero.localized_name)}</h1><b class="${cls(hw)}">${hw.toFixed(1)}% побед</b></span></div>
    <h2>Что покупать</h2>${top.map(i => `${tg(i.img, 1)}${esc(i.dname)}</span>`).join('') || '<span class="mu">Нет данных</span>'}
    <h2>Его контрят</h2>${m.slice(0, 6).map(x => `${tg(x.h.img)}${esc(x.h.localized_name)} <small>${(100 - x.w).toFixed(0)}% у соперника</small></span>`).join('')}
    <h2>Он силён против</h2>${m.slice(-6).reverse().map(x => `${tg(x.h.img)}${esc(x.h.localized_name)} <small>${x.w.toFixed(0)}% побед</small></span>`).join('')}</div>`;
    $('#modal').classList.add('show');
  });
}
const closeM = () => $('#modal').classList.remove('show');
const H = {
  tab: async b => { tab = b.dataset.tab; render(); },
  role: b => { role = b.dataset.r; render(); },
  hero: b => openHero(b.dataset.id), close: closeM, toastx: b => b.closest('.toast').remove(),
  reload: () => tab === 'profile' ? loadProfile() : loadHeroes(),
  login: async () => { const a = acc($('#sid').value); if (!a) return toast('Неверный ID', 'Нужен числовой ID или ссылка вида steamcommunity.com/profiles/7656…', 'alert'); await set({ steamId: a }); P = null; PE = ''; toast('Готово', 'Профиль сохранён', 'check'); render(); },
  logout: async () => { await set({ steamId: '' }); P = null; PE = ''; render(); },
  osn: async () => { await set({ osNotify: !S.osNotify }); render(); }
};
document.addEventListener('click', e => { const t = e.target.closest('[data-act]'); if (t && H[t.dataset.act]) H[t.dataset.act](t); else if (e.target.id === 'modal') closeM(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeM(); });
document.addEventListener('input', e => { if (e.target.id === 'q') { q = e.target.value; $('#hl').innerHTML = filt().sort((a, b) => a.localized_name.localeCompare(b.localized_name)).map(hrow).join('') || '<p class="mu">Никого не нашли.</p>'; } });
document.addEventListener('change', async e => { if (e.target.id === 'bracket') { await set({ bracket: e.target.value }); toast('Сохранено', 'Ранг изменён', 'check'); } if (e.target.id === 'tabset') { await set({ tab: e.target.value }); toast('Сохранено', 'Стартовая вкладка изменена', 'check'); } });
window.addEventListener('offline', () => toast('Нет интернета', 'Данные не обновятся, пока связь не вернётся.', 'alert'));
window.addEventListener('unhandledrejection', e => console.error(e.reason));
(async () => { S = await A.get(); tab = S.tab || 'meta'; render(); await loadHeroes(); })();
</script></body></html>
